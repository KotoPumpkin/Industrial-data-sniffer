# =============================================================================
# Telegraf 工业数据采集配置
# =============================================================================

# 全局设置
[global_tags]
  env = "production"
  site = "factory-01"

[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  precision = "1ms"
  hostname = "$HOSTNAME"
  omit_hostname = false

# =============================================================================
# 输入插件 — 数据采集源
# =============================================================================

# ---------- MQTT 消费者 — 接收设备遥测数据 ----------
[[inputs.mqtt_consumer]]
  name_override = "industrial_metrics"
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "factory/cnc/#",
    "factory/sensor/#",
    "factory/plc/#",
    "factory/line/#"
  ]
  client_id = "telegraf-industrial"
  data_format = "json"
  json_string_fields = ["status", "machine_id", "product_id"]
  tag_keys = ["machine_id", "workshop", "line", "device_type", "point_id"]

# ---------- HTTP JSON — 拉取模拟器 REST API ----------
[[inputs.http]]
  name_override = "industrial_metrics"
  urls = ["http://simulator:5001/api/metrics"]
  method = "GET"
  data_format = "json"
  interval = "10s"
  json_string_fields = ["status", "machine_id"]
  tag_keys = ["machine_id", "workshop", "line"]

# ---------- 系统指标 ----------
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false

[[inputs.mem]]
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.net]]

[[inputs.system]]

# =============================================================================
# 处理器 — 数据清洗与增强
# =============================================================================

# 给所有工业指标添加采集时间戳标签
[[processors.override]]
  [processors.override.tags]
    collected_by = "telegraf"

# 数据类型转换
[[processors.converter]]
  [processors.converter.fields]
    float = ["temperature", "pressure", "humidity", "vibration", "voltage", "current", "power", "rpm", "feed_rate", "flow_rate"]
    integer = ["count", "defect_count", "runtime_seconds", "downtime_seconds"]

# =============================================================================
# 输出插件 — InfluxDB v2
# =============================================================================

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "my-super-secret-admin-token-2024"
  organization = "industrial"
  bucket = "factory"

  # 按测量名称路由
  namepass = ["industrial_*", "cpu", "mem", "disk", "net", "system"]
