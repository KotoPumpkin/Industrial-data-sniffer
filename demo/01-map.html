<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全国项目地图 — 工业数据采集管理平台</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080d;--panel:#0f1218;--ink:#e8eaef;--muted:#bcc5d0;--dim:#94a3b8;--blue:#3b82f6;--green:#34d399;--orange:#fb923c;--red:#f87171}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;overflow:hidden;height:100vh}
.glass{background:rgba(10,14,22,0.82);backdrop-filter:blur(16px) saturate(1.2);border:1px solid rgba(255,255,255,0.06)}
.h{font-family:Inter,sans-serif;font-weight:600}.k{font-family:Rajdhani,monospace;font-weight:600;letter-spacing:-0.02em}

header{height:3rem;background:#161a22;border-bottom:1px solid #232830;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:relative;z-index:20}
header .t{font:700 0.9rem Inter,sans-serif;color:var(--ink)}header .t span{font-weight:400;font-size:0.7rem;color:var(--dim);margin-left:8px;vertical-align:middle}
header .tip{font-size:0.7rem;color:var(--dim)}

.layout{display:flex;flex-direction:column;height:calc(100vh - 3rem)}
.layout-body{display:flex;flex:1;position:relative;overflow:hidden}
.map-area{flex:1;position:relative;min-width:0}
#map{width:100%;height:100%}

.top-bar{height:5rem;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid #232830;background:rgba(2,6,23,0.9)}
.top-bar .tb-alerts{flex:1;min-width:0;flex-shrink:0}
.top-bar .tb-alerts-title{font:600 0.65rem Inter,sans-serif;color:var(--dim);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px}
.top-bar .tb-alerts-scroll{overflow-x:auto;overflow-y:hidden;cursor:grab;scrollbar-width:none;-ms-overflow-style:none}
.top-bar .tb-alerts-scroll::-webkit-scrollbar{display:none}
.top-bar .tb-alerts-inner{display:flex;gap:8px;width:max-content}
.top-bar .tb-alert-card{width:210px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-radius:6px;font-size:0.7rem;white-space:nowrap}
.top-bar .tb-alert-card.crit{background:rgba(248,113,113,0.45);color:#fee2e2}
.top-bar .tb-alert-card.warn{background:rgba(251,146,60,0.35);color:#ffedd5}
.top-bar .tb-alert-card .trunc{overflow:hidden;text-overflow:ellipsis}
.top-bar .tb-metrics{display:flex;align-items:center;gap:0;flex-shrink:0}
.top-bar .tb-kpi-sep{width:1px;height:28px;background:#232830;margin:0 28px}
.top-bar .tb-kpi{text-align:center}.top-bar .tb-kpi .lbl{font:600 0.6rem Inter,sans-serif;color:var(--dim);text-transform:uppercase;letter-spacing:0.04em}.top-bar .tb-kpi .val{font:700 1.6rem Rajdhani,monospace;letter-spacing:-0.02em}
.right-panel{display:none}
.overflow-alerts{display:none}
.left-panel{width:280px;flex-shrink:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;border-left:1px solid #232830}

.panel-title{font:600 0.65rem Inter,sans-serif;color:var(--dim);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px}
.project-card{padding:12px;border-radius:8px;cursor:pointer;transition:all 0.2s}
.project-card:hover{background:#161a22;border-color:var(--blue)}
.project-card .pname{font:600 0.85rem Inter,sans-serif;color:var(--ink);margin-bottom:4px}
.project-card .pmeta{font-size:0.7rem;color:var(--dim);margin-bottom:8px}
.project-card .pstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.project-card .ps{text-align:center}.project-card .psv{font:600 1rem Rajdhani,monospace;letter-spacing:-0.02em}.project-card .psl{font-size:0.6rem;color:var(--dim);text-transform:uppercase;letter-spacing:0.03em}

.alert-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;font-size:0.72rem;border:none}
.alert-row.crit{background:rgba(248,113,113,0.55);color:#fff}
.alert-row.warn{background:rgba(251,146,60,0.45);color:#fff}
.alert-row .ad{color:inherit}.alert-row .at{color:inherit;opacity:0.8}
.alert-row .ad{flex:1}.alert-row .at{font:600 0.65rem Rajdhani,monospace}

.metric-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.75rem}
.metric-row .ml{color:var(--muted)}.metric-row .mv{font:600 0.9rem Rajdhani,monospace;letter-spacing:-0.02em}

.mini-chart{width:100%;height:100px}

.hint{position:absolute;bottom:10px;right:10px;color:rgba(255,255,255,0.35);font-size:0.65rem;pointer-events:none;z-index:5}

.map-widget{position:absolute;bottom:60px;left:10px;display:flex;align-items:stretch;gap:20px;padding:14px 18px;background:rgba(10,14,22,0.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:10px;z-index:10}
.map-widget .mw-donut{display:flex;flex-direction:column;align-items:center;gap:6px}
.map-widget .mw-donut .mw-chart{width:80px;height:80px}
.map-widget .mw-donut .mw-label{font:600 0.6rem Inter,sans-serif;color:var(--dim);text-transform:uppercase;letter-spacing:0.05em}
.map-widget .mw-divider{width:1px;background:#232830}
.map-widget .mw-health{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.map-widget .mw-health .mw-label{font:600 0.6rem Inter,sans-serif;color:var(--dim);text-transform:uppercase;letter-spacing:0.05em}
.map-widget .mw-health .mw-score{display:flex;align-items:baseline;gap:2px}
.map-widget .mw-health .mw-num{font:700 2.4rem Rajdhani,monospace;color:var(--green);letter-spacing:-0.02em;line-height:1}
.map-widget .mw-health .mw-max{font-size:0.7rem;color:var(--dim)}

.bottom-bar{position:absolute;bottom:0;left:0;right:280px;height:52px;display:flex;align-items:center;gap:0;padding:0;z-index:10}
.bottom-bar .bkpi{flex:1;text-align:center;padding:8px 0;background:rgba(10,14,22,0.9);border-top:1px solid #232830}
.bottom-bar .bkpi .bv{font:700 1.15rem Rajdhani,monospace;letter-spacing:-0.02em}
.bottom-bar .bkpi .bl{font-size:0.6rem;color:var(--dim);text-transform:uppercase;letter-spacing:0.04em}

@media(max-width:1100px){.left-panel,.top-bar{display:none}.bottom-bar{left:0;right:0}}
</style>
</head>
<body>
<header>
  <div class="t"><img src="logo.png" height="25" style="vertical-align:middle;margin-right:15px" alt="Logo">工业数据采集管理平台 <span>全国项目地图</span></div>
  <div class="tip">滚轮缩放 · 按住拖拽 · 点击项目区域进入项目概览</div>
</header>
<div class="layout">

<div class="top-bar" id="topBar"></div>
<div class="layout-body">
  <div class="map-area">
    <div id="map"></div>
    <div class="hint">🖱 滚轮缩放 · 按住拖拽 · 拖拽浏览</div>
    <div class="overflow-alerts" id="overflowAlerts"></div>
    <div class="map-widget" id="mapWidget"></div>
    <div class="bottom-bar" id="bottomBar"></div>
  </div>
  <div class="left-panel" id="leftPanel"></div>
</div>

</div>

<script>
// ========== MOCK DATA ==========
var PROJECTS = {
  'project-huadong':{id:'project-huadong',name:'华东智能制造',provinces:['广东省','江苏省','浙江省'],center:[118,32],neon:'#3b82f6',
    stats:{workshops:3,devices:12,points:84,oee:87.3,online:11,alerts:1,temp:40.2,vib:2.1,prod:24580}},
  'project-beifang':{id:'project-beifang',name:'北方重工',provinces:['山东省','天津市','辽宁省'],center:[118,38],neon:'#fb923c',
    stats:{workshops:3,devices:12,points:84,oee:82.7,online:9,alerts:3,temp:45.8,vib:3.2,prod:18200}},
  'project-xinan':{id:'project-xinan',name:'西南精密制造',provinces:['四川省','重庆市','云南省'],center:[104,28],neon:'#34d399',
    stats:{workshops:3,devices:12,points:84,oee:91.2,online:12,alerts:0,temp:37.5,vib:1.6,prod:20150}},
};
var CITIES=[{n:'深圳',lng:114.06,lat:22.54},{n:'苏州',lng:120.59,lat:31.30},{n:'杭州',lng:120.16,lat:30.27},{n:'青岛',lng:120.38,lat:36.07},{n:'天津',lng:117.20,lat:39.08},{n:'大连',lng:121.61,lat:38.91},{n:'成都',lng:104.07,lat:30.57},{n:'重庆',lng:106.91,lat:29.43},{n:'昆明',lng:102.72,lat:25.04}];
var WS_BRIEF={深圳:{name:'深圳数控车间',devices:4,oee:89.2,temp:42.1,vib:2.3,neon:'#3b82f6'},苏州:{name:'苏州精密车间',devices:4,oee:85.7,temp:38.5,vib:2.8,neon:'#3b82f6'},杭州:{name:'杭州电子车间',devices:4,oee:91.5,temp:40.8,vib:1.9,neon:'#3b82f6'},青岛:{name:'青岛模具车间',devices:4,oee:84.3,temp:43.5,vib:2.6,neon:'#fb923c'},天津:{name:'天津装配车间',devices:4,oee:80.5,temp:46.2,vib:3.4,neon:'#fb923c'},大连:{name:'大连重工车间',devices:4,oee:82.8,temp:44.1,vib:3.1,neon:'#fb923c'},成都:{name:'成都重装车间',devices:4,oee:90.8,temp:38.2,vib:1.7,neon:'#34d399'},重庆:{name:'重庆模具车间',devices:4,oee:88.5,temp:39.5,vib:2.0,neon:'#34d399'},昆明:{name:'昆明精工车间',devices:4,oee:92.1,temp:36.8,vib:1.5,neon:'#34d399'}};

var projList = Object.values(PROJECTS);
var totalDevices = projList.reduce(function(s,p){return s+p.stats.devices;},0);
var totalOnline = projList.reduce(function(s,p){return s+p.stats.online;},0);
var totalAlerts = projList.reduce(function(s,p){return s+p.stats.alerts;},0);
var avgOEE = (projList.reduce(function(s,p){return s+p.stats.oee;},0)/projList.length).toFixed(1);

// ===== LEFT PANEL: Project Cards =====
document.getElementById('leftPanel').innerHTML =
  '<div class="panel-title">全国项目概览</div>'+
  '<div style="font:600 1.2rem Rajdhani,monospace;color:#fff;letter-spacing:-0.02em;margin-bottom:4px">'+projList.length+'<span style="font-size:0.7rem;color:var(--dim);margin-left:4px">个项目</span></div>'+
  '<div style="font-size:0.7rem;color:var(--dim);margin-bottom:10px">'+totalDevices+' 设备 · '+totalOnline+' 在线 · '+totalAlerts+' 告警</div>'+
  projList.map(function(p){
    var s=p.stats;
    return'<a class="glass project-card" href="02-project.html?id='+p.id+'" style="text-decoration:none;color:inherit;display:block"><div class="pname"><span style="display:inline-block;width:7px;height:7px;background:'+p.neon+';margin-right:6px;border-radius:1px"></span>'+p.name+'</div><div class="pmeta">'+p.provinces.slice(0,2).join(' · ')+'</div><div class="pstats"><div class="ps"><div class="psv" style="color:'+p.neon+'">'+s.oee+'%</div><div class="psl">效率</div></div><div class="ps"><div class="psv" style="color:'+(s.alerts>0?'var(--red)':'var(--green)')+'">'+s.alerts+'</div><div class="psl">告警</div></div><div class="ps"><div class="psv" style="color:var(--ink)">'+s.online+'</div><div class="psl">在线</div></div></div></a>';
  }).join('')+
  '<div style="margin-top:auto"><div class="panel-title" style="margin-top:8px">24h 项目效率趋势</div><div id="chartMiniOEE" class="mini-chart"></div></div>';

// ===== RIGHT PANEL: Alerts + Metrics =====
var mockAlerts=[
  {l:'北方重工 主轴温度超限',t:'2m',c:'crit'},
  {l:'北方重工 振动幅度过高',t:'8m',c:'warn'},
  {l:'北方重工 功率消耗异常',t:'15m',c:'warn'},
  {l:'华东智能制造 主轴温度偏高',t:'32m',c:'warn'},
];
document.getElementById('topBar').innerHTML =
  '<div class="tb-alerts"><div class="tb-alerts-title">实时告警</div>'+
  '<div class="tb-alerts-scroll"><div class="tb-alerts-inner">'+
  mockAlerts.map(function(a){return'<div class="tb-alert-card '+a.c+'"><span class="trunc">'+a.l+'</span><span style="margin-left:8px;font-size:0.65rem;opacity:0.8">'+a.t+'前</span></div>';}).join('')+
  '</div></div></div>'+
  '<div class="tb-metrics">'+
  '<div class="tb-kpi"><div class="lbl">总设备数</div><div class="val" style="color:var(--ink)">'+totalDevices+'</div></div>'+
  '<div class="tb-kpi-sep"></div>'+
  '<div class="tb-kpi"><div class="lbl">在线率</div><div class="val" style="color:var(--green)">'+(totalOnline/totalDevices*100).toFixed(0)+'%</div></div>'+
  '<div class="tb-kpi-sep"></div>'+
  '<div class="tb-kpi"><div class="lbl">平均 OEE</div><div class="val" style="color:var(--blue)">'+avgOEE+'%</div></div>'+
  '<div class="tb-kpi-sep"></div>'+
  '<div class="tb-kpi"><div class="lbl">活跃告警</div><div class="val" style="color:'+(totalAlerts>0?'var(--red)':'var(--green)')+'">'+totalAlerts+'</div></div>'+
  '</div>';

// ===== BOTTOM BAR =====
document.getElementById('bottomBar').innerHTML =
  projList.map(function(p){return'<div class="bkpi"><div class="bv" style="color:'+p.neon+'">'+p.stats.oee+'%</div><div class="bl">'+p.name+'</div></div>';}).join('')+
  '<div class="bkpi"><div class="bv" style="color:var(--ink)">'+(totalOnline/totalDevices*100).toFixed(0)+'%</div><div class="bl">在线率</div></div>'+
  '<div class="bkpi"><div class="bv" style="color:var(--green)">'+avgOEE+'%</div><div class="bl">平均OEE</div></div>';

// ===== MAP =====
var chart=echarts.init(document.getElementById('map'),'dark');
fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json').then(function(r){return r.json();}).then(function(geo){
  echarts.registerMap('china',geo);
  var regs=[];
  projList.forEach(function(p){p.provinces.forEach(function(pv){regs.push({name:pv,itemStyle:{areaColor:p.neon+'40',borderColor:p.neon+'c0',borderWidth:2},emphasis:{itemStyle:{areaColor:p.neon+'65',borderColor:'#fff',borderWidth:2.5}}});});});
  function wcard(w){return'<div style="min-width:200px"><div style="font-size:15px;font-weight:700;color:#fff;margin-bottom:8px"><span style="display:inline-block;width:8px;height:8px;background:'+w.neon+';margin-right:8px;border-radius:2px"></span>'+w.name+'</div><table style="width:100%;border-collapse:collapse;font-size:12px"><tr><td style="color:#94a3b8;padding:2px 0">设备数</td><td style="text-align:right;color:#e2e8f0;font-weight:600">'+w.devices+'</td></tr><tr><td style="color:#94a3b8;padding:2px 0">运行效率</td><td style="text-align:right;color:'+w.neon+';font-weight:700;font-size:14px">'+w.oee+'%</td></tr><tr><td style="color:#94a3b8;padding:2px 0">平均温度</td><td style="text-align:right;color:'+(w.temp>65?'#f87171':w.temp>45?'#fb923c':'#e8eaef')+';font-weight:600">'+w.temp+'°C</td></tr><tr><td style="color:#94a3b8;padding:2px 0">平均振动</td><td style="text-align:right;color:'+(w.vib>3?'#fb923c':'#e8eaef')+';font-weight:600">'+w.vib+' mm/s</td></tr></table><div style="margin-top:8px;font-size:11px;color:'+w.neon+';text-align:right">点击进入车间概览 →</div></div>';}
var fmt=function(ps){for(var k in PROJECTS){var p=PROJECTS[k];if(p.name===ps.name||p.provinces.indexOf(ps.name)>=0)return card(p);}if(WS_BRIEF[ps.name])return wcard(WS_BRIEF[ps.name]);return ps.name?'<span style="color:#94a3b8;font-size:12px">'+ps.name+'</span>':'';};
  chart.setOption({
    tooltip:{trigger:'item',backgroundColor:'#0a0e18',borderColor:'#1e3050',borderWidth:1,padding:[12,16],textStyle:{color:'#e8eaef',fontSize:13},extraCssText:'border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.6)',
      formatter:function(ps){return fmt(ps);}
    },
    backgroundColor:'transparent',
    geo:{map:'china',roam:true,zoom:1.2,center:[110,35],aspectScale:0.85,scaleLimit:{min:0.8,max:8},label:{show:false},itemStyle:{areaColor:'#0a1420',borderColor:'#1e3048',borderWidth:0.8},emphasis:{label:{show:false},itemStyle:{areaColor:'#162a44'}},regions:regs,silent:false,
      tooltip:{show:true,backgroundColor:'#0a0e18',borderColor:'#1e3050',borderWidth:1,padding:[12,16],textStyle:{color:'#e8eaef',fontSize:13},extraCssText:'border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.6)',
        formatter:function(ps){return fmt(ps);}
      }
    },
    series:[
      {type:'effectScatter',coordinateSystem:'geo',data:projList.map(function(p){return{name:p.name,value:p.center.concat([24]),itemStyle:{color:p.neon}};}),symbolSize:20,rippleEffect:{brushType:'stroke',scale:3,period:3},zlevel:2,label:{show:true,formatter:'{b}',position:'bottom',distance:12,color:'#e2e8f0',fontSize:13,fontWeight:700,fontFamily:'Inter'}},
      {type:'scatter',coordinateSystem:'geo',data:CITIES.map(function(w){return{name:w.n,value:[w.lng,w.lat,8],itemStyle:{color:'#64748b'}};}),symbolSize:6,zlevel:1,label:{show:true,formatter:'{b}',position:'right',distance:4,color:'#b0bac7',fontSize:11,fontFamily:'Inter'}},
    ]
  });
  chart.on('click',function(ps){
    var hit;
    if(ps.seriesType==='effectScatter'){hit=projList.find(function(x){return x.name===ps.name;});}
    else{hit=projList.find(function(x){return x.provinces.indexOf(ps.name)>=0;});}
    if(hit){location.href='02-project.html?id='+hit.id;}
  });
  chart.on('georoam',function(ps){if(ps.zoom)return;var opt=chart.getOption();var c=opt.geo[0].center;var cl=[Math.min(140,Math.max(70,c[0])),Math.min(55,Math.max(15,c[1]))];if(c[0]!==cl[0]||c[1]!==cl[1])chart.setOption({geo:{center:cl}});});
}).catch(function(e){console.error('Map load failed',e);});
window.addEventListener('resize',function(){chart.resize();});

function card(pp){var s=pp.stats;return'<div style="min-width:200px"><div style="font-size:15px;font-weight:700;color:#fff;margin-bottom:8px"><span style="display:inline-block;width:8px;height:8px;background:'+pp.neon+';margin-right:8px;border-radius:2px"></span>'+pp.name+'</div><table style="width:100%;border-collapse:collapse;font-size:12px"><tr><td style="color:#94a3b8;padding:2px 0">车间数</td><td style="text-align:right;color:#e2e8f0;font-weight:600">'+s.workshops+'</td></tr><tr><td style="color:#94a3b8;padding:2px 0">设备数</td><td style="text-align:right;color:#e2e8f0;font-weight:600">'+s.devices+'</td></tr><tr><td style="color:#94a3b8;padding:2px 0">采集点位</td><td style="text-align:right;color:#e2e8f0;font-weight:600">'+s.points+'</td></tr><tr><td style="color:#94a3b8;padding:2px 0">运行效率</td><td style="text-align:right;color:'+pp.neon+';font-weight:700;font-size:14px">'+s.oee+'%</td></tr><tr><td style="color:#94a3b8;padding:2px 0">在线设备</td><td style="text-align:right;color:#34d399;font-weight:600">'+s.online+'</td></tr><tr><td style="color:#94a3b8;padding:2px 0">活跃告警</td><td style="text-align:right;color:'+(s.alerts>0?'#f87171':'#e2e8f0')+';font-weight:600">'+s.alerts+'</td></tr></table><div style="border-top:1px solid #1e3050;margin-top:8px;padding-top:8px;font-size:11px;color:#64748b">效率参数: 产量计数 · 不良品数 · 良品率 · OEE · 节拍时间</div><div style="margin-top:8px;font-size:11px;color:'+pp.neon+';text-align:right">点击进入项目概览 →</div></div>';}

// ===== MAP WIDGET: Donut + Health Score =====
document.getElementById('mapWidget').innerHTML =
  '<div class="mw-donut">'+
    '<div id="chartDonut" class="mw-chart"></div>'+
    '<div class="mw-label">设备状态分布</div>'+
  '</div>'+
  '<div class="mw-divider"></div>'+
  '<div class="mw-health">'+
    '<div class="mw-label">综合健康分</div>'+
    '<div class="mw-score"><span class="mw-num">94</span><span class="mw-max">/100</span></div>'+
  '</div>';

// ===== MINI CHARTS =====
(function(){
  var inst=echarts.init(document.getElementById('chartMiniOEE'),'dark');
  var h=[];for(var i=23;i>=0;i--)h.push(i+':00');
  inst.setOption({
    grid:{top:4,right:4,bottom:16,left:28},
    xAxis:{type:'category',data:h,axisLabel:{color:'var(--dim)',fontSize:7,interval:5},axisLine:{show:false},axisTick:{show:false}},
    yAxis:{type:'value',min:70,max:100,axisLabel:{color:'var(--dim)',fontSize:7},splitLine:{lineStyle:{color:'rgba(255,255,255,0.04)'}}},
    series:projList.map(function(p){
      var d=[];for(var i=0;i<24;i++)d.push(parseFloat((p.stats.oee+Math.sin(i*0.5)*8+Math.sin(i*0.2)*3+(Math.random()-0.5)*3).toFixed(1)));
      return{type:'line',data:d,smooth:true,symbol:'none',lineStyle:{color:p.neon,width:1.5}};
    })
  });
})();

(function(){
  var inst=echarts.init(document.getElementById('chartDonut'),'dark');
  inst.setOption({
    series:[{type:'pie',radius:['55%','75%'],center:['50%','50%'],avoidLabelOverlap:false,label:{show:false},
      data:[
        {value:totalOnline,name:'在线',itemStyle:{color:'#34d399'}},
        {value:totalDevices-totalOnline-totalAlerts,name:'离线',itemStyle:{color:'#64748b'}},
        {value:totalAlerts,name:'告警',itemStyle:{color:'#f87171'}},
      ]}]
  });
})();
</script>
