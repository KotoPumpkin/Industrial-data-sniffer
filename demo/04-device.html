<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备详情 — 工业数据采集管理平台</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080d;--panel:#0f1218;--ink:#e8eaef;--muted:#bcc5d0;--dim:#94a3b8;--blue:#3b82f6;--green:#34d399;--orange:#fb923c;--red:#f87171}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;min-height:100vh}
.glass{background:rgba(10,14,22,0.82);backdrop-filter:blur(16px) saturate(1.2);border:1px solid rgba(255,255,255,0.06)}
header{height:3.2rem;background:#161a22;border-bottom:1px solid #232830;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
header .t{font:700 0.95rem Inter,sans-serif;color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:3px;font:600 0.72rem Inter,sans-serif;color:var(--ink);text-decoration:none;padding:5px 12px;border:1px solid #3d4a5c;border-radius:6px;background:#1a2030;transition:all 0.2s}.back:hover{color:#fff;border-color:var(--blue);background:#1e2d4a}
main{max-width:1200px;margin:0 auto;padding:24px 20px}
.bc{font-size:0.75rem;color:var(--dim);margin-bottom:16px}.bc a{color:var(--blue);text-decoration:none}
.h1{font:700 1.5rem Inter,sans-serif;color:#fff;margin-bottom:4px}
.sub{font-size:0.8rem;color:var(--dim);margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.stat{padding:14px 16px;border-radius:8px}.stat .l{font:600 0.7rem Inter,sans-serif;text-transform:uppercase;letter-spacing:0.05em;color:var(--dim)}.stat .v{font:600 1.75rem Rajdhani,monospace;letter-spacing:-0.02em;margin-top:2px}.stat .u{font:0.75rem Rajdhani,monospace;color:var(--dim);margin-left:4px}
.cht{font:600 0.7rem Inter,sans-serif;text-transform:uppercase;letter-spacing:0.05em;color:var(--dim);margin-bottom:12px}
.card{padding:16px}
.dd{position:relative;display:inline-block}
.dd-trig{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--panel);border:1px solid #232830;border-radius:8px;font:600 0.8rem Inter,sans-serif;color:var(--ink);cursor:pointer;transition:all 0.2s}.dd-trig:hover{border-color:var(--blue);background:#161a22}
.dd-trig svg{width:12px;height:12px;transition:transform 0.2s}
.dd.open .dd-trig svg{transform:rotate(180deg)}
.dd-menu{position:absolute;top:100%;left:0;margin-top:4px;background:var(--panel);border:1px solid #232830;border-radius:8px;min-width:220px;z-index:50;display:none;overflow:hidden;box-shadow:0 20px 25px -5px rgba(0,0,0,0.4)}
.dd.open .dd-menu{display:block}
.dd-opt{padding:10px 14px;font-size:0.8rem;color:var(--muted);cursor:pointer;transition:all 0.15s}.dd-opt:hover{color:var(--ink);background:rgba(255,255,255,0.04)}.dd-opt.sel{color:var(--blue);background:rgba(59,130,246,0.1)}
.dd-opt .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;vertical-align:middle}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:12px">
    <a href="03-workshop.html?id=workshop-sz&pid=project-huadong" class="back">← 返回车间</a>
    <div class="t"><img src="logo.png" height="24" style="vertical-align:middle;margin-right:6px" alt="Logo"> 工业数据采集管理平台 <span style="font-weight:400;font-size:0.75rem;color:var(--dim);margin-left:10px">设备详情</span></div>
  </div>
  <div style="font-size:0.85rem;color:var(--muted)">CNC-SZ01</div>
</header>
<main>
  <div class="bc"><a href="01-map.html">全国项目地图</a> / <a href="02-project.html?id=project-huadong">华东智能制造项目</a> / <a href="03-workshop.html?id=workshop-sz&pid=project-huadong">深圳数控车间</a> / CNC-SZ01</div>
  <div class="h1">CNC-SZ01</div>
  <div class="sub">
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#3b82f6;margin-right:6px"></span>数控机床</span>
    <span style="color:var(--dim)">|</span>
    <div class="dd" id="pointDd">
      <div class="dd-trig" onclick="document.getElementById('pointDd').classList.toggle('open')">
        <span id="curPointLabel">主轴温度 (°C)</span>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg>
      </div>
      <div class="dd-menu">
        <div class="dd-opt sel" onclick="selectPoint('temperature')"><span class="dot" style="background:#f87171"></span>主轴温度 <span style="color:var(--dim);font-size:0.7rem;margin-left:4px">°C</span></div>
        <div class="dd-opt" onclick="selectPoint('vibration')"><span class="dot" style="background:#fb923c"></span>振动幅度 <span style="color:var(--dim);font-size:0.7rem;margin-left:4px">mm/s</span></div>
        <div class="dd-opt" onclick="selectPoint('rpm')"><span class="dot" style="background:#3b82f6"></span>主轴转速 <span style="color:var(--dim);font-size:0.7rem;margin-left:4px">rpm</span></div>
        <div class="dd-opt" onclick="selectPoint('power')"><span class="dot" style="background:#34d399"></span>功率消耗 <span style="color:var(--dim);font-size:0.7rem;margin-left:4px">W</span></div>
        <div class="dd-opt" onclick="selectPoint('feed_rate')"><span class="dot" style="background:#a78bfa"></span>进给速率 <span style="color:var(--dim);font-size:0.7rem;margin-left:4px">mm/min</span></div>
        <div class="dd-opt" onclick="selectPoint('voltage')"><span class="dot" style="background:#fbbf24"></span>电压 <span style="color:var(--dim);font-size:0.7rem;margin-left:4px">V</span></div>
        <div class="dd-opt" onclick="selectPoint('current')"><span class="dot" style="background:#22d3ee"></span>电流 <span style="color:var(--dim);font-size:0.7rem;margin-left:4px">A</span></div>
      </div>
    </div>
  </div>

  <div class="grid4" id="stats">
    <div class="glass stat"><div class="l">当前值</div><div class="v" style="color:#f87171">42<span class="u">°C</span></div></div>
    <div class="glass stat"><div class="l">24h均值</div><div class="v" style="color:#e8eaef">41.2<span class="u">°C</span></div></div>
    <div class="glass stat"><div class="l">24h峰值</div><div class="v" style="color:#e8eaef">48.5<span class="u">°C</span></div></div>
    <div class="glass stat"><div class="l">24h谷值</div><div class="v" style="color:#e8eaef">34.8<span class="u">°C</span></div></div>
  </div>

  <div class="glass card" style="margin-bottom:24px"><div class="cht" id="trendTitle">主轴温度 趋势（24h）</div><div id="cTrend" style="width:100%;height:300px"></div></div>

  <div class="grid2">
    <div class="glass card"><div class="cht">数值分布</div><div id="cDist" style="width:100%;height:240px"></div></div>
    <div class="glass card"><div class="cht">关联指标</div><div id="cScatter" style="width:100%;height:240px"></div></div>
  </div>

  <div class="glass card"><div class="cht">全点位实时雷达图</div><div id="cRadar" style="width:100%;height:300px"></div></div>
</main>

<script>
(function(){
var N='#3b82f6';
var PTS=[
  {id:'temperature',label:'主轴温度',unit:'°C',base:42,range:8,color:'#f87171'},
  {id:'vibration',label:'振动幅度',unit:'mm/s',base:2.2,range:0.9,color:'#fb923c'},
  {id:'rpm',label:'主轴转速',unit:'rpm',base:3800,range:600,color:'#3b82f6'},
  {id:'power',label:'功率消耗',unit:'W',base:4500,range:1000,color:'#34d399'},
  {id:'feed_rate',label:'进给速率',unit:'mm/min',base:120,range:30,color:'#a78bfa'},
  {id:'voltage',label:'电压',unit:'V',base:380,range:20,color:'#fbbf24'},
  {id:'current',label:'电流',unit:'A',base:12,range:3,color:'#22d3ee'}
];
function r(n,b,R){return parseFloat((b+Math.sin(n*0.18)*R*0.5+Math.sin(n*0.07)*R*0.3+(Math.random()-0.5)*R*0.2).toFixed(2));}
function gs(iv,n,b,R){var d=[],now=new Date();for(var i=n-1;i>=0;i--){d.push({time:new Date(now-i*iv*1000).toISOString(),value:r(i,b,R)});}return d;}
var ptD={};PTS.forEach(function(p){ptD[p.id]=gs(300,288,p.base,p.range);});

var cur='temperature';

// Chart instances
var cTrend, cDist, cScat, cRadar;

function getPt(pid){return PTS.find(function(x){return x.id===pid;})||PTS[0];}

function drawTrend(pid){
  var pt=getPt(pid),data=ptD[pt.id];
  document.getElementById('curPointLabel').textContent=pt.label+' ('+pt.unit+')';
  document.getElementById('trendTitle').textContent=pt.label+' 趋势（24h）';
  if(!cTrend)cTrend=echarts.init(document.getElementById('cTrend'),'dark');
  cTrend.setOption({tooltip:{trigger:'axis',backgroundColor:'#0a0e18',borderColor:'#232830'},grid:{top:8,right:12,bottom:24,left:48},xAxis:{type:'time',axisLabel:{color:'#94a3b8',fontSize:10,formatter:function(v){var d=new Date(v);return(d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':00';}},splitLine:{show:false}},yAxis:{type:'value',axisLabel:{color:'#94a3b8',fontSize:10},splitLine:{lineStyle:{color:'rgba(255,255,255,0.06)'}}},dataZoom:[{type:'inside',start:0,end:100}],series:[{type:'line',data:data.map(function(v){return[v.time,v.value];}),smooth:true,symbol:'none',lineStyle:{color:pt.color,width:2},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:pt.color+'30'},{offset:1,color:pt.color+'04'}])},markLine:{silent:true,data:[{yAxis:pt.base,name:'基准',label:{color:'#94a3b8',fontSize:10},lineStyle:{color:'rgba(255,255,255,0.3)',type:'dashed'}}]}}]});
}

function drawDist(pid){
  var pt=getPt(pid),d=ptD[pt.id].map(function(v){return v.value;}).sort(function(a,b){return a-b;}),bins=20,bw=(d[d.length-1]-d[0])/bins,h=Array(bins).fill(0);
  d.forEach(function(v){var i=Math.min(bins-1,Math.floor((v-d[0])/bw));h[i]++;});
  if(!cDist)cDist=echarts.init(document.getElementById('cDist'),'dark');
  cDist.setOption({tooltip:{trigger:'axis',backgroundColor:'#0a0e18',borderColor:'#232830'},grid:{top:8,right:10,bottom:24,left:36},xAxis:{data:h.map(function(_,i){return(d[0]+i*bw).toFixed(1);}),axisLabel:{color:'#94a3b8',fontSize:9},splitLine:{show:false}},yAxis:{axisLabel:{color:'#94a3b8',fontSize:10},splitLine:{lineStyle:{color:'rgba(255,255,255,0.06)'}}},series:[{type:'bar',data:h,itemStyle:{color:pt.color+'80',borderRadius:2},barWidth:'90%'}]});
}

function drawScat(pid){
  var pt=getPt(pid),ni=(PTS.findIndex(function(x){return x.id===pid;})+1)%PTS.length,np=PTS[ni];
  var d=[];for(var i=0;i<Math.min(ptD[pt.id].length,ptD[np.id].length);i+=5)d.push([ptD[pt.id][i].value,ptD[np.id][i].value]);
  if(!cScat)cScat=echarts.init(document.getElementById('cScatter'),'dark');
  cScat.setOption({tooltip:{backgroundColor:'#0a0e18',borderColor:'#232830'},grid:{top:8,right:10,bottom:24,left:48},xAxis:{name:pt.label,type:'value',nameTextStyle:{color:'#94a3b8',fontSize:10},axisLabel:{color:'#94a3b8',fontSize:10},splitLine:{lineStyle:{color:'rgba(255,255,255,0.06)'}}},yAxis:{name:np.label,type:'value',nameTextStyle:{color:'#94a3b8',fontSize:10},axisLabel:{color:'#94a3b8',fontSize:10},splitLine:{lineStyle:{color:'rgba(255,255,255,0.06)'}}},series:[{type:'scatter',data:d,symbolSize:3,itemStyle:{color:pt.color+'80'}}]});
}

function drawRadar(){
  if(!cRadar)cRadar=echarts.init(document.getElementById('cRadar'),'dark');
  cRadar.setOption({tooltip:{backgroundColor:'#0a0e18',borderColor:'#232830'},legend:{data:['当前值','基准值'],bottom:0,textStyle:{color:'#bcc5d0',fontSize:10}},radar:{center:['50%','50%'],radius:'60%',indicator:PTS.map(function(p){return{name:p.label,max:100};}),axisName:{color:'#bcc5d0',fontSize:10},splitArea:{areaStyle:{color:['rgba(255,255,255,0.02)','transparent','rgba(255,255,255,0.02)','transparent']}}},series:[{type:'radar',data:[{value:PTS.map(function(p){var vv=ptD[p.id];return parseInt(vv[vv.length-1].value/(p.base*1.5)*100);}),name:'当前值',areaStyle:{color:N+'20'},lineStyle:{color:N},symbol:'circle',symbolSize:4}]},{type:'radar',data:[{value:PTS.map(function(p){return parseInt(p.base/(p.base*1.5)*100);}),name:'基准值',areaStyle:{color:'transparent'},lineStyle:{color:'#94a3b8',type:'dashed'},symbol:'none'}]}]});
}

function updStats(pid){
  var pt=getPt(pid),vs=ptD[pt.id].map(function(v){return v.value;}),sum=0;vs.forEach(function(v){sum+=v;});
  var mean=(sum/vs.length).toFixed(1),mx=Math.max.apply(null,vs).toFixed(1),mn=Math.min.apply(null,vs).toFixed(1),last=vs[vs.length-1].toFixed(1);
  document.getElementById('stats').innerHTML=[{l:'当前值',v:last,c:pt.color},{l:'24h均值',v:mean,c:'#e8eaef'},{l:'24h峰值',v:mx,c:mx>pt.base*1.3?'#f87171':'#e8eaef'},{l:'24h谷值',v:mn,c:'#e8eaef'}].map(function(s){return'<div class="glass stat"><div class="l">'+s.l+'</div><div class="v" style="color:'+s.c+'">'+s.v+'<span class="u">'+pt.unit+'</span></div></div>';}).join('');
}

window.selectPoint=function(pid){
  cur=pid;document.getElementById('pointDd').classList.remove('open');
  updStats(pid);drawTrend(pid);drawDist(pid);drawScat(pid);
  var opts=document.querySelectorAll('.dd-opt');opts.forEach(function(o,i){o.classList.toggle('sel',i===PTS.findIndex(function(p){return p.id===pid;}));});
};

// Init after layout
requestAnimationFrame(function(){
  requestAnimationFrame(function(){
    drawTrend(cur);drawDist(cur);drawScat(cur);drawRadar();
  });
});

document.addEventListener('click',function(e){var dd=document.getElementById('pointDd');if(!dd.contains(e.target))dd.classList.remove('open');});
})();
</script>
</body>
</html>
