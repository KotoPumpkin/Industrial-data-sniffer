services:
  # ==================== 时序数据库 ====================
  influxdb:
    image: influxdb:2.7
    container_name: idm_influxdb
    env_file: .env
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_RETENTION=30d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXD_TLS_CERT=/etc/influxdb/certs/server.crt
      - INFLUXD_TLS_KEY=/etc/influxdb/certs/server.key
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - ./influxdb/init:/docker-entrypoint-initdb.d
      - ./secrets:/etc/influxdb/certs:ro
    networks:
      - industrial_net
    healthcheck:
      test: ["CMD-SHELL", "curl -kf https://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== 数据采集引擎 ====================
  telegraf:
    image: telegraf:1.30
    container_name: idm_telegraf
    depends_on:
      influxdb:
        condition: service_healthy
    env_file: .env
    environment:
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      - industrial_net
    restart: unless-stopped

  # ==================== 可视化平台 ====================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: idm_grafana
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_THEME_DEFAULT=dark
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/industrial_overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - industrial_net
    restart: unless-stopped

  # ==================== MQTT 消息代理 ====================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: idm_mosquitto
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwords:/mosquitto/config/passwords:ro
    networks:
      - industrial_net
    restart: unless-stopped

  # ==================== 工业数据模拟器 ====================
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: idm_simulator
    depends_on:
      - mosquitto
    env_file: .env
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - INFLUXDB_URL=https://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
    networks:
      - industrial_net
    restart: unless-stopped

  # ==================== 管理后台 ====================
  manager:
    build:
      context: .
      dockerfile: ./manager/Dockerfile
    container_name: idm_manager
    ports:
      - "5000:5000"
    depends_on:
      - influxdb
      - telegraf
    volumes:
      - ./manager/data:/app/data
      - ./manager/static:/app/static
    env_file: .env
    environment:
      - INFLUXDB_URL=https://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5000}
      - VERIFY_TLS=${VERIFY_TLS:-true}
      - SIMULATOR_URL=http://simulator:5001
    networks:
      - industrial_net
    restart: unless-stopped

volumes:
  influxdb_data:
  grafana_data:

networks:
  industrial_net:
    driver: bridge
