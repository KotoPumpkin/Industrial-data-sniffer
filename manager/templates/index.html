<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工业数据采集管理平台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root {
    --bg-canvas: #080b10;
    --bg-panel: #0f1218;
    --bg-panel-header: #161a22;
    --bg-sidebar: #0c0f14;
    --bg-input: #161a22;
    --bg-hover: #1c2029;
    --border: #232830;
    --border-light: #2d333b;
    --text-primary: #e0e3e8;
    --text-secondary: #8b919a;
    --text-muted: #555b66;
    --text-link: #6ea8fe;
    --blue: #3b82f6;
    --blue-dim: #1e3a5f;
    --green: #34d399;
    --green-dark: #0d3320;
    --orange: #fb923c;
    --orange-dark: #3d2410;
    --red: #f87171;
    --red-dark: #3b1515;
    --cyan: #22d3ee;
    --font: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
    font-family: var(--font); background: var(--bg-canvas); color: var(--text-primary);
    min-height: 100vh; display: grid;
    grid-template-columns: 11.5rem 1fr; grid-template-rows: 3.2rem 1fr;
    -webkit-font-smoothing: antialiased;
}

/* TOPBAR */
.topbar {
    grid-column: 1 / -1; background: var(--bg-panel-header);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.2rem; z-index: 50;
}
.topbar-left { display: flex; align-items: center; gap: 0.6rem; }
.topbar-logo {
    width: 1.8rem; height: 1.8rem; background: linear-gradient(135deg, #fb923c, #f87171);
    border-radius: 0.4rem; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.9rem; color: #fff;
}
.topbar-title { font-size: 0.95rem; font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 1rem; }
.topbar-indicator { display: flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; color: var(--text-secondary); }
.topbar-indicator .dot { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--green); }
.topbar-clock { font-size: 0.8rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.refresh-select {
    font-family: var(--font); font-size: 0.75rem; padding: 0.15rem 0.4rem;
    border: 1px solid var(--border); border-radius: 0.2rem;
    background: var(--bg-input); color: var(--text-secondary); outline: none; cursor: pointer;
}

/* SIDEBAR */
.sidebar {
    background: var(--bg-sidebar); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 0.5rem 0; overflow-y: auto;
}
.sb-section { padding: 0.3rem 0.6rem; }
.sb-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 0.4rem 0.6rem; }
.sb-item {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.45rem 0.7rem; border-radius: 0.35rem; cursor: pointer;
    color: var(--text-muted); transition: all 0.15s; font-size: 0.8rem;
}
.sb-item:hover { background: var(--bg-hover); color: var(--text-secondary); }
.sb-item.active { background: var(--bg-hover); color: var(--text-primary); }
.sb-item.active::before {
    content: ''; position: absolute; left: 0; width: 3px; height: 1.2rem;
    background: var(--blue); border-radius: 0 2px 2px 0;
}
.sb-item { position: relative; }
.sb-item svg { width: 1.1rem; height: 1.1rem; flex-shrink: 0; }
.sb-sep { height: 1px; background: var(--border); margin: 0.4rem 0.8rem; }
.sb-spacer { flex: 1; }

/* MAIN */
.main { overflow-y: auto; overflow-x: hidden; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }

/* PAGE VIEWS */
.page-view { display: none; }
.page-view.active { display: flex; flex-direction: column; gap: 1rem; }

/* ROW */
.row { display: grid; gap: 1rem; }
.row-2 { grid-template-columns: 1fr 1fr; }
.row-3-2 { grid-template-columns: 3fr 2fr; }
.row-map { grid-template-columns: 1.6fr 1fr; }

/* PANEL */
.panel {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 0.4rem; overflow: hidden; display: flex; flex-direction: column;
}
.panel-header {
    background: var(--bg-panel-header); padding: 0.5rem 0.8rem;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border); min-height: 2.2rem;
}
.panel-title { font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); }
.panel-body { padding: 0.8rem; flex: 1; position: relative; }
.panel-body.p0 { padding: 0; overflow: visible; }

/* STAT CARDS */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; }
.stat-card {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 0.4rem; padding: 0.8rem 1rem;
}
.stat-card .sc-label { font-size: 0.7rem; font-weight: 500; color: var(--text-muted); letter-spacing: 0.04em; }
.stat-card .sc-value { font-size: 1.6rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; margin-top: 0.2rem; }
.sc-value.blue { color: var(--text-link); }
.sc-value.green { color: var(--green); }
.sc-value.red { color: var(--red); }
.sc-value.orange { color: var(--orange); }

/* SERVICE LIST */
.svc-list { max-height: 16rem; overflow-y: auto; }
.svc-row {
    display: grid; grid-template-columns: 1fr auto auto; align-items: center;
    gap: 0.6rem; padding: 0.5rem 0.8rem; border-bottom: 1px solid var(--border); font-size: 0.8rem;
}
.svc-row:last-child { border-bottom: none; }
.svc-name { color: var(--text-primary); font-weight: 500; }
.svc-name.link { color: var(--text-link); cursor: pointer; }
.svc-name.link:hover { text-decoration: underline; }
.svc-port { color: var(--text-muted); font-variant-numeric: tabular-nums; font-size: 0.75rem; }
.svc-badge { font-size: 0.65rem; font-weight: 600; padding: 0.1rem 0.5rem; border-radius: 0.2rem; text-transform: uppercase; }
.svc-badge.online { background: var(--green-dark); color: var(--green); }
.svc-badge.degraded { background: var(--orange-dark); color: var(--orange); }

/* TABLE */
.table-wrap { max-height: 18rem; overflow-y: auto; }
.table-wrap.tall { max-height: 26rem; }
.data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
.data-table th {
    padding: 0.5rem 0.7rem; text-align: left; font-weight: 600; font-size: 0.7rem;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border); background: var(--bg-panel-header); white-space: nowrap;
    position: sticky; top: 0; z-index: 2;
}
.data-table td { padding: 0.45rem 0.7rem; border-bottom: 1px solid var(--border); color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
.data-table tr:hover td { background: var(--bg-hover); }
.data-table td.hl { color: var(--text-primary); font-weight: 500; }
.data-table td.link { color: var(--text-link); cursor: pointer; }
.data-table td.link:hover { text-decoration: underline; }

/* FILTER BAR */
.filter-bar { display: flex; gap: 0.6rem; align-items: flex-end; flex-wrap: wrap; }
.fg { display: flex; flex-direction: column; gap: 0.2rem; }
.fg label { font-size: 0.65rem; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.fg select, .fg input {
    font-family: var(--font); font-size: 0.8rem; padding: 0.3rem 0.5rem;
    border: 1px solid var(--border); border-radius: 0.3rem;
    background: var(--bg-input); color: var(--text-primary); outline: none; min-width: 7rem;
}
.fg select:focus, .fg input:focus { border-color: var(--blue); }

/* TABS */
.tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg-panel-header); padding: 0 0.8rem; }
.tab-btn {
    padding: 0.5rem 0.9rem; font-size: 0.8rem; font-weight: 500; color: var(--text-muted);
    background: none; border: none; border-bottom: 2px solid transparent;
    cursor: pointer; transition: all 0.12s; font-family: var(--font);
}
.tab-btn:hover { color: var(--text-secondary); }
.tab-btn.active { color: var(--text-link); border-bottom-color: var(--blue); }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* CHART */
.chart-box { position: relative; width: 100%; height: 18rem; }
.chart-box canvas { width: 100% !important; height: 100% !important; }
#chinaMap { width: 100%; height: 55rem; }

/* STATS BAR */
.stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; margin-bottom: 0.8rem; }
.sb-item-box { background: var(--bg-panel-header); border: 1px solid var(--border); border-radius: 0.3rem; padding: 0.5rem 0.7rem; }
.sb-item-box .sb-val { font-size: 1.1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.sb-item-box .sb-lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 0.1rem; }

/* ALERTS */
.alert-item { display: grid; grid-template-columns: 4.5rem 1fr auto; align-items: center; gap: 0.6rem; padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
.alert-item:last-child { border-bottom: none; }
.a-badge { font-size: 0.65rem; font-weight: 600; padding: 0.1rem 0.5rem; border-radius: 0.2rem; text-align: center; }
.a-badge.critical { background: var(--red-dark); color: var(--red); }
.a-badge.warning { background: var(--orange-dark); color: var(--orange); }
.a-msg { color: var(--text-secondary); }
.a-time { font-size: 0.7rem; color: var(--text-muted); }

/* CORRELATION */
.corr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; padding: 0.8rem 0; }
.corr-main { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; background: var(--bg-panel-header); border: 1px solid var(--border); border-radius: 0.4rem; }
.corr-value { font-size: 2.5rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.corr-value.positive { color: var(--green); }
.corr-value.negative { color: var(--red); }
.corr-label { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.4rem; }
.corr-details { display: flex; flex-direction: column; gap: 0.4rem; }
.corr-row { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
.corr-row .cr-lbl { color: var(--text-muted); }
.corr-row .cr-val { color: var(--text-primary); font-weight: 500; }

/* DATA GOVERNANCE */
.gov-score-ring { display: flex; align-items: center; gap: 1.5rem; }
.gov-ring { width: 6rem; height: 6rem; }
.gov-dims { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; flex: 1; }
.gov-dim-item { background: var(--bg-panel-header); border: 1px solid var(--border); border-radius: 0.3rem; padding: 0.5rem 0.7rem; }
.gov-dim-item .gd-lbl { font-size: 0.65rem; color: var(--text-muted); }
.gov-dim-item .gd-val { font-size: 1rem; font-weight: 600; margin-top: 0.1rem; }
.gov-dim-item .gd-bar { height: 0.2rem; background: var(--border); border-radius: 1rem; margin-top: 0.3rem; overflow: hidden; }
.gov-dim-item .gd-bar-fill { height: 100%; border-radius: 1rem; transition: width 0.8s; }

.gov-flow { display: flex; flex-direction: column; gap: 0.3rem; }
.gov-flow-item { display: grid; grid-template-columns: 5rem 1fr auto auto; align-items: center; gap: 0.6rem; padding: 0.5rem 0.7rem; background: var(--bg-panel-header); border: 1px solid var(--border); border-radius: 0.3rem; font-size: 0.8rem; }
.gov-flow-item .gf-stage { font-weight: 600; color: var(--cyan); }
.gov-flow-item .gf-desc { color: var(--text-secondary); }
.gov-flow-item .gf-count { color: var(--text-muted); font-size: 0.75rem; }
.gov-flow-item .gf-proto { font-size: 0.65rem; color: var(--text-muted); background: var(--bg-input); padding: 0.1rem 0.4rem; border-radius: 0.15rem; }

.gov-rule-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
.gov-rule-table th { padding: 0.4rem 0.6rem; text-align: left; font-size: 0.7rem; color: var(--text-muted); border-bottom: 1px solid var(--border); background: var(--bg-panel-header); }
.gov-rule-table td { padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); color: var(--text-secondary); }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal-content { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 0.4rem; max-width: 50rem; width: 92%; max-height: 80vh; overflow-y: auto; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 0.7rem 1rem; border-bottom: 1px solid var(--border); background: var(--bg-panel-header); gap: 0.6rem; }
.modal-header h3 { font-size: 0.95rem; font-weight: 600; }
.modal-close { background: none; border: 1px solid var(--border); border-radius: 0.3rem; font-family: var(--font); font-size: 0.75rem; padding: 0.2rem 0.6rem; cursor: pointer; color: var(--text-secondary); }
.modal-close:hover { border-color: var(--red); color: var(--red); }
.modal-body { padding: 1rem; }
.report-health { font-size: 0.7rem; font-weight: 600; padding: 0.15rem 0.6rem; border-radius: 0.2rem; }
.report-health.normal { background: var(--green-dark); color: var(--green); }
.report-health.warning { background: var(--orange-dark); color: var(--orange); }
.report-health.critical { background: var(--red-dark); color: var(--red); }
.report-metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 0.6rem; margin-top: 0.6rem; }
.rm-card { background: var(--bg-panel-header); border: 1px solid var(--border); border-radius: 0.3rem; padding: 0.7rem; }
.rm-card .rm-name { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.4rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); }
.rm-card .rm-row { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 0.15rem 0; }
.rm-card .rm-row .rm-lbl { color: var(--text-muted); }
.rm-card .rm-row .rm-v { color: var(--text-primary); font-weight: 500; }

.badge { font-size: 0.65rem; font-weight: 600; padding: 0.1rem 0.5rem; border-radius: 0.2rem; }
.badge.high { background: var(--red-dark); color: var(--red); }
.badge.medium { background: var(--orange-dark); color: var(--orange); }
.badge.low { background: rgba(52,211,153,0.15); color: var(--green); }

.loading { display: flex; align-items: center; justify-content: center; padding: 2rem; font-size: 0.8rem; color: var(--text-muted); }
.no-data { text-align: center; padding: 2rem; font-size: 0.8rem; color: var(--text-muted); }

/* Collection points tags */
.cp-tags { display: flex; flex-wrap: wrap; gap: 0.25rem; }
.cp-tag { font-size: 0.65rem; padding: 0.1rem 0.4rem; border-radius: 0.15rem; background: var(--blue-dim); color: var(--text-link); }

/* Nested device table */
.data-table tr.lv-row { cursor: pointer; }
.data-table tr.lv-row td { font-weight: 600; color: var(--text-primary); background: var(--bg-panel-header); }
.data-table tr.lv2-row td { color: var(--text-primary); background: rgba(22,26,34,0.5); }
.data-table tr.lv3-row td { color: var(--text-secondary); }
.data-table tr.lv2-row td.indent-1 { padding-left: 1.6rem; }
.data-table tr.lv3-row td.indent-2 { padding-left: 2.6rem; font-weight: 400; }
.data-table tr.lv3-row td.indent-2 .point-label { color: var(--text-primary); font-weight: 500; }
.data-table tr.lv-row .caret { display: inline-block; width: 0.8rem; transition: transform 0.18s; color: var(--text-muted); margin-right: 0.35rem; font-size: 0.7rem; }
.data-table tr.lv-row.collapsed .caret { transform: rotate(-90deg); }
.data-table tr.child-row { display: none; }
.data-table tr.child-row.show { display: table-row; }

/* Manual refresh button */
.btn-refresh {
    font-family: var(--font); font-size: 0.75rem; font-weight: 500;
    padding: 0.3rem 0.7rem; border: 1px solid var(--border); border-radius: 0.3rem;
    background: var(--bg-input); color: var(--text-secondary); cursor: pointer;
    display: inline-flex; align-items: center; gap: 0.35rem; transition: all 0.12s;
}
.btn-refresh:hover { border-color: var(--blue); color: var(--text-link); }
.btn-refresh:disabled { cursor: not-allowed; opacity: 0.7; }
.btn-refresh .spin-icon { width: 0.85rem; height: 0.85rem; transition: transform 0.4s; }
.btn-refresh.spinning .spin-icon { animation: btn-spin 0.9s linear infinite; }
@keyframes btn-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

@media (max-width: 90rem) {
    .row-map { grid-template-columns: 1fr; }
    #chinaMap { height: 40rem; }
}
@media (max-width: 64rem) {
    body { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-left">
        <div class="topbar-logo">I</div>
        <div class="topbar-title">工业数据采集管理平台</div>
    </div>
    <div class="topbar-right">
        <div class="topbar-indicator"><div class="dot" id="statusDot"></div><span id="statusText">连接中</span></div>
        <select class="refresh-select" id="refreshInterval" title="刷新间隔">
            <option value="5" selected>5秒</option>
            <option value="15">15秒</option>
            <option value="60">1分钟</option>
        </select>
        <div class="topbar-clock" id="clock">--:--:--</div>
    </div>
</div>

<!-- SIDEBAR -->
<nav class="sidebar">
    <div class="sb-section">
        <div class="sb-label">监控</div>
        <div class="sb-item active" data-page="dashboard" onclick="switchPage('dashboard')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            仪表盘
        </div>
    </div>
    <div class="sb-sep"></div>
    <div class="sb-section">
        <div class="sb-label">分析</div>
        <div class="sb-item" data-page="governance" onclick="switchPage('governance')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
            数据治理
        </div>
    </div>
    <div class="sb-sep"></div>
    <div class="sb-section">
        <div class="sb-label">外部服务</div>
        <div class="sb-item" onclick="window.open('http://localhost:3000','_blank')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            Grafana
        </div>
        <div class="sb-item" onclick="window.open('http://localhost:8086','_blank')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M9 9h6v6H9z"/></svg>
            InfluxDB
        </div>
    </div>
    <div class="sb-spacer"></div>
</nav>

<!-- MAIN -->
<main class="main">

<!-- ========== 仪表盘 ========== -->
<div class="page-view active" id="page-dashboard">
    <!-- 统计卡片 -->
    <div class="stat-grid">
        <div class="stat-card"><div class="sc-label">在线设备</div><div class="sc-value blue" id="heroDevices">--</div></div>
        <div class="stat-card"><div class="sc-label">活跃告警</div><div class="sc-value orange" id="heroAlerts">--</div></div>
        <div class="stat-card"><div class="sc-label">异常检测</div><div class="sc-value red" id="heroAnomalies">--</div></div>
        <div class="stat-card"><div class="sc-label">车间数</div><div class="sc-value green" id="heroWorkshops">--</div></div>
    </div>

    <!-- 地图 + 服务 -->
    <div class="row row-map">
        <div class="panel">
            <div class="panel-header"><div class="panel-title">🗺 全国车间分布</div></div>
            <div class="panel-body p0"><div id="chinaMap"></div></div>
        </div>
        <div class="panel">
            <div class="panel-header"><div class="panel-title">系统服务</div></div>
            <div class="panel-body p0"><div class="svc-list" id="servicesList"><div class="loading">加载中...</div></div></div>
        </div>
    </div>

    <!-- 设备列表 -->
    <div class="panel">
        <div class="panel-header">

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
function fmt(v, d=1) { return v != null ? Number(v).toFixed(d) : '--'; }

// 时钟
(function tick() {
    $('#clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    requestAnimationFrame(tick);
})();

// 车间映射
const WORKSHOP_MAP = {
    'workshop-1': { name: '深圳数控车间', province: '广东省', city: '深圳', lat: 22.5431, lng: 114.0579 },
    'workshop-2': { name: '苏州精密车间', province: '江苏省', city: '苏州', lat: 31.2990, lng: 120.5853 },
    'workshop-3': { name: '青岛模具车间', province: '山东省', city: '青岛', lat: 36.0671, lng: 120.3826 },
    'workshop-4': { name: '杭州电子车间', province: '浙江省', city: '杭州', lat: 30.2741, lng: 120.1551 },
    'workshop-5': { name: '成都重装车间', province: '四川省', city: '成都', lat: 30.5728, lng: 104.0668 },
};

// 设备类型采集点位
const DEVICE_POINTS = {
    cnc: ['主轴温度','振动幅度','主轴转速','功率消耗','进给速率','电压','电流'],
    sensor: ['环境温度','相对湿度','气压','流量'],
    plc: ['产量计数','不良品数','良品率','设备综合效率','节拍时间'],
};

// 按设备类型分组的点位映射（中文标签 -> 英文字段名），解决不同设备类型同名字段冲突
const DEVICE_POINT_FIELDS = {
    cnc: {
        '主轴温度': 'temperature', '振动幅度': 'vibration', '主轴转速': 'rpm',
        '功率消耗': 'power', '进给速率': 'feed_rate', '电压': 'voltage', '电流': 'current',
    },
    sensor: {
        '环境温度': 'temperature', '相对湿度': 'humidity', '气压': 'pressure', '流量': 'flow_rate',
    },
    plc: {
        '产量计数': 'count', '不良品数': 'defect_count', '良品率': 'quality_rate',
        '设备综合效率': 'oee', '节拍时间': 'cycle_time',
    },
};
const CN_TO_FIELD = {};
(Object.values(DEVICE_POINT_FIELDS)).forEach(fields => Object.assign(CN_TO_FIELD, fields));
const FIELD_CN_MAP = Object.fromEntries(
    Object.entries(CN_TO_FIELD).map(([k, v]) => [v, k])
);

// ===== 页面切换 =====
function switchPage(page) {
    $$('.sb-item').forEach(i => i.classList.remove('active'));
    const item = $(`.sb-item[data-page="${page}"]`);
    if (item) item.classList.add('active');
    $$('.page-view').forEach(p => p.classList.remove('active'));
    $(`#page-${page}`).classList.add('active');
    if (page === 'governance') loadGovernance();
    if (page === 'dashboard' && !chinaMapReady) initChinaMap();
}

// ===== 服务状态 =====
let allDevicesData = [];
async function loadServices() {
    try {
        const r = await fetch('/api/system/status');
        const svcs = await r.json();
        const online = svcs.filter(s => s.status === 'online').length;
        $('#statusText').textContent = online === svcs.length ? '全部正常' : '部分异常';
        $('#statusDot').style.background = online === svcs.length ? 'var(--green)' : 'var(--orange)';
        $('#servicesList').innerHTML = svcs.map(s => {
            const cls = s.url ? 'svc-name link' : 'svc-name';
            const click = s.url ? `onclick="window.open('${s.url}','_blank')"` : '';
            return `<div class="svc-row" ${click}>
                <span class="${cls}">${s.name}</span>
                <span class="svc-port">${s.port || ''}</span>
                <span class="svc-badge ${s.status}">${s.status === 'online' ? '在线' : '异常'}</span>
            </div>`;
        }).join('');
    } catch(e) { $('#servicesList').innerHTML = '<div class="no-data">无法连接后端</div>'; }
}

// ===== 设备数据（嵌套表格：车间 → 设备 → 点位） =====
// allDevicesData 结构（来自 /api/devices/tree）：
// [{ device_id, device_type, device_type_cn, workshop, points:[{point_id,label,metric,unit,value}] }]

async function loadDevices() {
    try {
        const r = await fetch('/api/devices/tree');
        allDevicesData = await r.json();
        $('#heroDevices').textContent = allDevicesData.length;
        $('#heroWorkshops').textContent = new Set(allDevicesData.map(d => d.workshop).filter(Boolean)).size || 5;
        populateFilters();
        renderDeviceTable();
    } catch(e) { console.error(e); }
}

function populateFilters() {
    const savedWs = $('#filterWorkshop').value;
    const savedDev = $('#filterDevice').value;
    const savedCorr = $('#corrDevice').value;

    const workshops = [...new Set(allDevicesData.map(d => d.workshop).filter(Boolean))];
    const ws = $('#filterWorkshop');
    ws.innerHTML = '<option value="">全部车间</option>' + workshops.map(w => {
        const info = WORKSHOP_MAP[w];
        return `<option value="${w}">${info ? info.name : w}</option>`;
    }).join('');
    if (savedWs) ws.value = savedWs;
    updateDeviceFilter(true);
    if (savedDev) $('#filterDevice').value = savedDev;
    if (savedCorr) $('#corrDevice').value = savedCorr;
}

function updateDeviceFilter(fromPopulate) {
    const ws = $('#filterWorkshop').value;
    const savedDev = $('#filterDevice').value;
    const filtered = ws ? allDevicesData.filter(d => d.workshop === ws) : allDevicesData;
    const ds = $('#filterDevice');
    ds.innerHTML = '<option value="">全部设备</option>' + filtered.map(d => `<option value="${d.device_id}">${d.device_id}</option>`).join('');
    if (!fromPopulate && savedDev) ds.value = savedDev;
    // Sync corr device list（保留选中）
    const savedCorr = $('#corrDevice').value;
    const opts = allDevicesData.map(d => `<option value="${d.device_id}">${d.device_id}</option>`).join('');
    $('#corrDevice').innerHTML = opts;
    if (savedCorr) $('#corrDevice').value = savedCorr;
}

// 点位筛选状态（用于实时趋势图）
let _selectedPointField = null;
let _selectedPointLabel = null;

function updatePointFilter() {
    const dev = $('#filterDevice').value;
    const ws = $('#filterWorkshop').value;
    const saved = $('#filterPoint').value;
    const sel = $('#filterPoint');

    // 当前筛选范围内的设备集合
    const filtered = dev
        ? allDevicesData.filter(d => d.device_id === dev)
        : (ws ? allDevicesData.filter(d => d.workshop === ws) : allDevicesData);

    // 汇总所有 metric，去重（field -> label）
    const metricSet = new Map();
    filtered.forEach(d => {
        (d.points || []).forEach(p => {
            if (p.metric && !metricSet.has(p.metric)) metricSet.set(p.metric, p.label || p.metric);
        });
    });

    sel.innerHTML = '<option value="">全部点位</option>';
    [...metricSet.entries()].forEach(([field, label]) => {
        sel.innerHTML += `<option value="${field}">${label} (${field})</option>`;
    });
    if (saved) sel.value = saved;
}

function applyDeviceFilter() {
    updateDeviceFilter();
    updatePointFilter();
    renderDeviceTable();
    refreshPointRealtime();
}

// ===== 嵌套表格渲染 =====
let _rowIdSeq = 0;
function nextRowId() { return 'r' + (++_rowIdSeq); }
function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
}

async function manualLoadAnomaly() {
    const btn = $('#anomalyRefreshBtn');
    if (!btn) return;
    btn.disabled = true;
    btn.classList.add('spinning');
    try { await loadAnomaly(); } finally {
        setTimeout(() => { btn.classList.remove('spinning'); btn.disabled = false; }, 450);
    }
}

async function manualLoadCorrelation() {
    const btn = $('#corrRefreshBtn');
    if (!btn) return;
    btn.disabled = true;
    btn.classList.add('spinning');
    try { await loadCorrelation(); } finally {
        setTimeout(() => { btn.classList.remove('spinning'); btn.disabled = false; }, 450);
    }
}

function renderDeviceTable() {
    const ws = $('#filterWorkshop').value;
    const dev = $('#filterDevice').value;
    const tbody = $('#devicesTable tbody');

    // 1. 未选车间：提示
    if (!ws) {
        tbody.innerHTML = '<tr><td colspan="5"><div class="no-data">请先选择车间</div></td></tr>';
        return;
    }

    // 2. 过滤数据
    let devices = allDevicesData.filter(d => d.workshop === ws);
    if (dev) devices = devices.filter(d => d.device_id === dev);
    if (!devices.length) {
        tbody.innerHTML = '<tr><td colspan="5"><div class="no-data">该车间暂无设备数据</div></td></tr>';
        return;
    }

    const wsInfo = WORKSHOP_MAP[ws];
    const wsName = wsInfo ? wsInfo.name : ws;

    const rows = [];

    if (dev) {
        // 模式B：顶级=设备，次级=点位
        devices.forEach(d => {
            const topId = nextRowId();
            rows.push(`<tr class="lv-row" id="${topId}" onclick="toggleRow('${topId}')">
                <td colspan="5"><span class="caret">▼</span>${escapeHtml(d.device_id)} <span style="color:var(--text-muted);font-weight:400;margin-left:0.6rem;">${escapeHtml(d.device_type_cn || d.device_type || '')} · ${escapeHtml(wsName)} · ${d.points?.length || 0} 点位</span></td>
            </tr>`);
            (d.points || []).forEach(p => rows.push(pointRow(p, topId, 2)));
        });
    } else {
        // 模式A：顶级=车间，次级=设备，末级=点位
        const topId = nextRowId();
        rows.push(`<tr class="lv-row" id="${topId}" onclick="toggleRow('${topId}')">
            <td colspan="5"><span class="caret">▼</span>${escapeHtml(wsName)} <span style="color:var(--text-muted);font-weight:400;margin-left:0.6rem;">${devices.length} 台设备</span></td>
        </tr>`);
        devices.forEach(d => {
            const devRowId = nextRowId();
            rows.push(`<tr class="lv2-row child-row ${topId}-child" id="${devRowId}" onclick="toggleRow('${devRowId}', event)">
                <td class="indent-1"><span class="caret">▼</span><span class="link" onclick="event.stopPropagation();openReport('${escapeHtml(d.device_id)}')">${escapeHtml(d.device_id)}</span></td>
                <td style="color:var(--text-muted)">${escapeHtml(d.device_type_cn || d.device_type || '')}</td>
                <td style="color:var(--text-muted)">—</td>
                <td style="color:var(--text-muted)">${d.points?.length || 0} 点位</td>
                <td style="color:var(--text-muted)">—</td>
            </tr>`);
            (d.points || []).forEach(p => rows.push(pointRow(p, devRowId, 3)));
        });
    }

    tbody.innerHTML = rows.join('');

    // 默认全部展开
    requestAnimationFrame(() => {
        $$('#devicesTable tr.child-row').forEach(r => r.classList.add('show'));
    });
}

function pointRow(p, parentRowId, level) {
    const indentCls = 'indent-2';
    const childCls = `${parentRowId}-child`;
    const valStr = (p.value != null && !isNaN(p.value)) ? Number(p.value).toFixed(2) : '--';
    return `<tr class="lv3-row child-row ${childCls}">
        <td class="${indentCls}"><span class="point-label">${escapeHtml(p.label || '-')}</span></td>
        <td style="color:var(--text-muted)">${escapeHtml(p.point_id || '')}</td>
        <td>${escapeHtml(p.metric || '-')}</td>
        <td class="hl">${valStr}</td>
        <td>${escapeHtml(p.unit || '')}</td>
    </tr>`;
}

function toggleRow(rowId, ev) {
    const row = document.getElementById(rowId);
    if (!row) return;
    const collapsed = row.classList.toggle('collapsed');
    document.querySelectorAll(`#devicesTable tr.${rowId}-child`).forEach(k => {
        if (collapsed) k.classList.remove('show');
        else k.classList.add('show');
    });
    if (ev) ev.stopPropagation();
}

// ===== 中国地图 =====
let chinaMapReady = false;
let mapChart = null;

async function initChinaMap() {
    if (chinaMapReady) return;
    try {
        const resp = await fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json');
        const geoJson = await resp.json();
        if (geoJson.features) {
            geoJson.features = geoJson.features.filter(f => f.properties.name !== '南海诸岛' && f.properties.name !== '十段线');
        }
        echarts.registerMap('china', geoJson);
        mapChart = echarts.init(document.getElementById('chinaMap'), null, { renderer: 'canvas' });

        const scatterData = Object.entries(WORKSHOP_MAP).map(([wid, info]) => ({
            name: info.name, value: [info.lng, info.lat, info.city]
        }));

        const option = {
            backgroundColor: 'transparent',
            tooltip: {
                trigger: 'item',
                backgroundColor: 'rgba(15,18,24,0.95)',
                borderColor: '#232830',
                textStyle: { color: '#e0e3e8', fontSize: 12 },
                formatter: function(p) {
                    if (p.seriesType === 'effectScatter') {
                        return `<b>${p.name}</b><br/>城市：${p.value[2]}`;
                    }
                    return `<b>${p.name}</b>`;
                }
            },
            geo: {
                map: 'china',
                roam: false,
                zoom: 1.3,
                center: [104.5, 36],
                label: { show: false },
                itemStyle: {
                    areaColor: '#141820',
                    borderColor: '#2a3040',
                    borderWidth: 1,
                },
                emphasis: {
                    itemStyle: { areaColor: '#1e2a3a', borderColor: '#3b82f6', borderWidth: 1.5 },
                    label: { show: true, color: '#e0e3e8', fontSize: 10 }
                },
                regions: [
                    { name: '广东省', itemStyle: { areaColor: '#1a3352' } },
                    { name: '江苏省', itemStyle: { areaColor: '#1a3352' } },
                    { name: '山东省', itemStyle: { areaColor: '#1a3352' } },
                    { name: '浙江省', itemStyle: { areaColor: '#1a3352' } },
                    { name: '四川省', itemStyle: { areaColor: '#1a3352' } },
                ]
            },
            series: [{
                type: 'effectScatter',
                coordinateSystem: 'geo',
                rippleEffect: { brushType: 'stroke', scale: 4, period: 4 },
                showEffectOn: 'render',
                symbolSize: 12,
                data: scatterData,
                itemStyle: { color: '#fb923c', shadowBlur: 10, shadowColor: 'rgba(251,146,60,0.5)' },
                label: {
                    show: true, formatter: '{b}', position: 'right',
                    color: '#fb923c', fontSize: 10, fontWeight: 500,
                    textBorderColor: '#080b10', textBorderWidth: 2
                },
                zlevel: 10
            }]
        };
        mapChart.setOption(option);
        chinaMapReady = true;
        window.addEventListener('resize', () => { if (mapChart) mapChart.resize(); });
    } catch(e) { console.error('地图加载失败:', e); }
}

// 颜色板，用于多线图
const TREND_COLORS = ['#3b82f6', '#f87171', '#34d399', '#fb923c', '#a78bfa', '#22d3ee', '#fbbf24', '#f472b6', '#818cf8', '#2dd4bf'];

// ===== 告警 =====
async function loadAlerts() {
    try {
        const r = await fetch('/api/analytics/alerts');
        const d = await r.json();
        const alerts = d.alerts || [];
        $('#heroAlerts').textContent = d.total || 0;
        if (!alerts.length) { $('#alertsList').innerHTML = '<div class="no-data">暂无告警</div>'; return; }
        $('#alertsList').innerHTML = alerts.map(a => `
            <div class="alert-item">
                <span class="a-badge ${a.level === 'critical' ? 'critical' : 'warning'}">${a.level === 'critical' ? '危险' : '警告'}</span>
                <span class="a-msg">${a.message || ''}</span>
                <span class="a-time">${a.time ? new Date(a.time).toLocaleTimeString('zh-CN',{hour12:false}) : ''}</span>
            </div>`).join('');
    } catch(e) { $('#alertsList').innerHTML = '<div class="no-data">加载失败</div>'; }
}

// ===== 异常检测 =====
async function loadAnomaly() {
    const metric = $('#anomalyMetric').value;
    const minutes = $('#anomalyRange').value;
    try {
        const r = await fetch(`/api/analytics/anomaly?metric=${metric}&minutes=${minutes}`);
        const d = await r.json();
        const anomalies = d.anomalies || [];
        $('#heroAnomalies').textContent = d.anomaly_count || 0;
        if (!anomalies.length) { $('#anomalyResult').innerHTML = '<div class="no-data">未检测到异常</div>'; return; }
        let html = `<div class="table-wrap"><table class="data-table">
            <thead><tr><th>设备</th><th>数值</th><th>Z-Score</th><th>严重程度</th><th>时间</th></tr></thead><tbody>`;
        anomalies.forEach(a => {
            const sev = (a.severity || 'low').toLowerCase();
            const sevText = sev === 'high' ? '高' : sev === 'medium' ? '中' : '低';
            html += `<tr>
                <td class="hl">${a.machine_id || ''}</td>
                <td class="hl">${fmt(a.value)}</td>
                <td>${a.z_score || ''}</td>
                <td><span class="badge ${sev}">${sevText}</span></td>
                <td>${a.time ? new Date(a.time).toLocaleTimeString('zh-CN',{hour12:false}) : ''}</td>
            </tr>`;
        });
        html += '</tbody></table></div>';
        $('#anomalyResult').innerHTML = html;
    } catch(e) { $('#anomalyResult').innerHTML = '<div class="no-data">检测失败</div>'; }
}

// ===== 关联分析 =====
async function loadCorrelation() {
    const device = $('#corrDevice').value;
    const ma = $('#corrMetricA').value;
    const mb = $('#corrMetricB').value;
    if (!device) return;
    try {
        const r = await fetch(`/api/analytics/correlation?metric_a=${ma}&metric_b=${mb}&device=${device}&minutes=60`);
        const d = await r.json();
        const corr = d.correlation;
        if (corr == null || corr === 0) { $('#corrResult').innerHTML = '<div class="no-data">数据不足</div>'; return; }
        const pct = (corr * 100).toFixed(1);
        const dir = corr >= 0 ? 'positive' : 'negative';
        const strength = Math.abs(corr) > 0.7 ? '强' : Math.abs(corr) > 0.4 ? '中等' : '弱';
        $('#corrResult').innerHTML = `
            <div class="corr-grid">
                <div class="corr-main">
                    <div class="corr-value ${dir}">${pct}%</div>
                    <div class="corr-label">r = ${corr.toFixed(4)}</div>
                </div>
                <div class="corr-details">
                    <div class="corr-row"><span class="cr-lbl">设备</span><span class="cr-val">${device}</span></div>
                    <div class="corr-row"><span class="cr-lbl">指标A</span><span class="cr-val">${ma}</span></div>
                    <div class="corr-row"><span class="cr-lbl">指标B</span><span class="cr-val">${mb}</span></div>
                    <div class="corr-row"><span class="cr-lbl">方向</span><span class="cr-val">${corr >= 0 ? '正相关' : '负相关'}</span></div>
                    <div class="corr-row"><span class="cr-lbl">强度</span><span class="cr-val">${strength}</span></div>
                    <div class="corr-row"><span class="cr-lbl">解读</span><span class="cr-val">${d.interpretation || ''}</span></div>
                </div>
            </div>`;
    } catch(e) { $('#corrResult').innerHTML = '<div class="no-data">分析失败</div>'; }
}

// ===== 数据治理 =====
let govLoaded = false;
async function loadGovernance() {
    if (govLoaded) return;
    try {
        const r = await fetch('/api/data-governance/overview');
        const d = await r.json();
        $('#govScore').textContent = d.quality_score;
        $('#govComplete').textContent = d.dimensions.completeness + '%';
        $('#govConsist').textContent = d.dimensions.consistency + '%';
        $('#govTimely').textContent = d.dimensions.timeliness + '%';
        $('#govFlow').innerHTML = d.data_flow.map(f => `
            <div class="gov-flow-item">
                <span class="gf-stage">${f.stage}</span>
                <span class="gf-desc">${f.desc}</span>
                <span class="gf-count">${f.count} 个</span>
                <span class="gf-proto">${f.protocol}</span>
            </div>`).join('');
        $('#govRules tbody').innerHTML = d.standard_rules.map(r => `
            <tr><td>${r.name}</td><td>${r.field}</td><td>${r.min}</td><td>${r.max}</td><td>${r.unit}</td></tr>`).join('');
        $('#govWorkshopTable tbody').innerHTML = d.workshops.map(w => `
            <tr>
                <td class="hl">${w.name}</td>
                <td>${w.province}</td>
                <td>${(w.data_points_24h / 1000).toFixed(1)}k</td>
                <td>${w.anomaly_rate}%</td>
                <td><span style="color:${w.quality_score > 90 ? 'var(--green)' : 'var(--orange)'}; font-weight:600">${w.quality_score}</span></td>
            </tr>`).join('');
        govLoaded = true;
    } catch(e) { console.error(e); }
}

// ===== 设备报告弹窗 =====
async function openReport(deviceId) {
    const modal = $('#modal');
    const inner = $('#modalInner');
    inner.innerHTML = '<div class="loading">加载报告中...</div>';
    modal.classList.add('active');
    try {
        const r = await fetch(`/api/analytics/device_report/${deviceId}`);
        const report = await r.json();
        const health = report.health_status || 'normal';
        const healthText = health === 'normal' ? '正常' : health === 'warning' ? '警告' : '危险';
        const metricsHtml = Object.entries(report.metrics || {}).map(([name, m]) => `
            <div class="rm-card">
                <div class="rm-name">${name}</div>
                <div class="rm-row"><span class="rm-lbl">最新值</span><span class="rm-v">${fmt(m.latest)}</span></div>
                <div class="rm-row"><span class="rm-lbl">均值</span><span class="rm-v">${fmt(m.mean)}</span></div>
                <div class="rm-row"><span class="rm-lbl">最小值</span><span class="rm-v">${fmt(m.min)}</span></div>
                <div class="rm-row"><span class="rm-lbl">最大值</span><span class="rm-v">${fmt(m.max)}</span></div>
                <div class="rm-row"><span class="rm-lbl">标准差</span><span class="rm-v">${fmt(m.std)}</span></div>
            </div>`).join('');
        inner.innerHTML = `
            <div class="modal-header">
                <h3>${deviceId} — 设备报告</h3>
                <span class="report-health ${health}">${healthText}</span>
                <button class="modal-close" onclick="closeModal()">关闭</button>
            </div>
            <div class="modal-body">
                <div style="margin-bottom:0.5rem;font-size:0.8rem;color:var(--text-muted)">健康评分: ${report.health_score}/100 | 分析周期: ${report.period_minutes}分钟</div>
                <div class="report-metrics">${metricsHtml || '<div class="no-data">暂无指标数据</div>'}</div>
            </div>`;
    } catch(e) { inner.innerHTML = '<div class="no-data">报告加载失败</div>'; }
}

function closeModal() { $('#modal').classList.remove('active'); }
$('#modal').addEventListener('click', e => { if (e.target === $('#modal')) closeModal(); });

// ===== 点位筛选 & 实时图表 =====
let pointRealtimeChart = null;

function onPointFilterChange() {
    const val = $('#filterPoint').value;
    _selectedPointField = val || null;
    _selectedPointLabel = val ? $('#filterPoint').selectedOptions[0].text : null;
    // 如果还需要更新点位下拉（例如设备没变但车间变了），已在 applyDeviceFilter 中处理
    renderDeviceTable();
    refreshPointRealtime();
}

async function refreshPointRealtime() {
    const field = _selectedPointField;
    if (!field) {
        $('#pointRealtimePanel').style.display = 'none';
        return;
    }
    $('#pointRealtimePanel').style.display = '';
    const label = _selectedPointLabel || field;
    $('#pointRealtimeTitle').textContent = `📈 ${label} — 实时趋势`;

    const dev = $('#filterDevice').value;
    const params = new URLSearchParams();
    if (dev) params.set('device', dev);
    params.set('minutes', '30');

    try {
        const r = await fetch(`/api/points/${field}/all-devices-history?${params}`);
        const d = await r.json();
        const deviceIds = d.device_ids || [];
        const series = d.series || [];
        if (!deviceIds.length || !series.length) {
            // clear chart
            if (pointRealtimeChart) { pointRealtimeChart.dispose(); pointRealtimeChart = null; }
            return;
        }

        // Render with ECharts
        const dom = document.getElementById('pointRealtimeChart');
        if (!pointRealtimeChart) {
            pointRealtimeChart = echarts.init(dom, null, { renderer: 'canvas' });
        }
        const times = series.map(s => s.time.substring(11, 19));
        const chartSeries = deviceIds.map((did, idx) => ({
            name: did,
            type: 'line',
            data: series.map(s => s[did] ?? null),
            smooth: true,
            lineStyle: { color: TREND_COLORS[idx % TREND_COLORS.length], width: 2 },
            symbol: 'none',
        }));
        pointRealtimeChart.setOption({
            grid: { top: 20, right: 20, bottom: 30, left: 50 },
            tooltip: { trigger: 'axis', appendToBody: true, confine: false },
            legend: {
                bottom: 0,
                textStyle: { color: '#8b919a', fontSize: 10 },
                data: deviceIds,
            },
            xAxis: { type: 'category', data: times, axisLabel: { color: '#555b66', fontSize: 10 } },
            yAxis: { type: 'value', axisLabel: { color: '#555b66', fontSize: 10 }, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } } },
            series: chartSeries,
        }, true);
    } catch(e) {
        console.error('point realtime chart error:', e);
    }
}

// ===== 自动刷新 =====
let _timer = null;
let _activeTab = 'alert';

function getActiveTabData() {
    switch (_activeTab) {
        case 'alert': loadAlerts(); break;
        case 'anomaly': loadAnomaly(); break;   // 异常检测参与自动刷新（按需求）
        // correlation 由手动刷新按钮触发，不参与自动循环
    }
}

function refreshAll() {
    loadServices();
    loadDevices();
    loadAlerts();
    getActiveTabData();
    if (_selectedPointField) refreshPointRealtime();
    // 嵌套表格默认展开 — 刷新数据后重新展开所有节点
    requestAnimationFrame(() => {
        $$('#devicesTable tr.child-row').forEach(r => r.classList.add('show'));
        $$('#devicesTable tr.lv-row, #devicesTable tr.lv2-row').forEach(r => r.classList.remove('collapsed'));
    });
}

function startAutoRefresh() {
    if (_timer) clearInterval(_timer);
    const sec = parseInt($('#refreshInterval').value) || 5;
    _timer = setInterval(refreshAll, sec * 1000);
}

$('#refreshInterval').addEventListener('change', () => { startAutoRefresh(); refreshAll(); });

$$('.tab-btn').forEach(tab => {
    tab.addEventListener('click', () => {
        $$('.tab-btn').forEach(t => t.classList.remove('active'));
        $$('.tab-content').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        $(`#tab-${tab.dataset.tab}`).classList.add('active');
        _activeTab = tab.dataset.tab;
        getActiveTabData();
    });
});

// ===== 初始化 =====
async function init() {
    await loadServices();
    await loadDevices();
    await loadAlerts();
    initChinaMap();
    _activeTab = 'alert';
    startAutoRefresh();
}
init();
</script>
