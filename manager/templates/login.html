<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — 工业数据采集管理平台</title>
<link href="https://fonts.lug.ustc.edu.cn/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-canvas: #080b10;
    --bg-panel: #0f1218;
    --bg-input: #1a1e27;
    --border: #2a2e38;
    --blue: #3b82f6;
    --blue-hover: #2563eb;
    --text: #e5e7eb;
    --text-muted: #6b7280;
    --red: #ef4444;
    --font: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: var(--font); background: var(--bg-canvas); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
.login-box {
    width: 100%; max-width: 24rem; padding: 2.5rem;
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 0.75rem;
}
.login-logo {
    display: block; width: 100%; max-width: 16rem; height: auto;
    margin: 0 auto 1.5rem auto;
}
.login-subtitle {
    font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-bottom: 2rem;
}
.field { margin-bottom: 1.25rem; }
.field label {
    display: block; font-size: 0.75rem; font-weight: 500;
    color: var(--text-muted); margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.05em;
}
.field input {
    width: 100%; padding: 0.55rem 0.7rem; font-size: 0.875rem;
    font-family: var(--font); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: 0.35rem;
    color: var(--text); outline: none; transition: border-color 0.15s;
}
.field input:focus { border-color: var(--blue); }
.btn {
    display: block; width: 100%; padding: 0.6rem; font-size: 0.875rem;
    font-family: var(--font); font-weight: 500; border: none; border-radius: 0.35rem;
    cursor: pointer; transition: background 0.15s; color: #fff; background: var(--blue);
}
.btn:hover { background: var(--blue-hover); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.error-msg {
    font-size: 0.8rem; color: var(--red); text-align: center;
    margin-top: 0.75rem; min-height: 1.2em;
}
.footer-link {
    display: block; text-align: center; margin-top: 1.25rem;
    font-size: 0.8rem; color: var(--text-muted);
}
.footer-link a { color: var(--blue); text-decoration: none; }
.footer-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="login-box">
    <img src="/static/logo.png" alt="Logo" class="login-logo" />
    <div class="login-subtitle">请登录以继续</div>
    <form id="loginForm" autocomplete="off">
        <div class="field">
            <label>用户名</label>
            <input type="text" id="username" placeholder="请输入用户名" required autofocus>
        </div>
        <div class="field">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn" id="submitBtn">登 录</button>
        <div class="error-msg" id="errorMsg"></div>
    </form>
    <div class="footer-link">还没有账户？<a href="/register">注册新用户</a></div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('errorMsg');
    btn.disabled = true; err.textContent = '';
    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
            }),
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.error || '登录失败'; return; }
        window.location.href = data.redirect || '/';
    } catch (ex) { err.textContent = '网络错误'; }
    finally { btn.disabled = false; }
});
</script>
</body>
</html>
